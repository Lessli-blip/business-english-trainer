<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172b4d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="English Trainer"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Business English Trainer</title><style>body{margin:0;background:#f2f5fa;color:#172b4d;font:16px system-ui,-apple-system,sans-serif}main{max-width:560px;margin:auto;padding:20px 16px calc(90px + env(safe-area-inset-bottom))}header{background:#172b4d;color:white;padding:22px;border-radius:20px}h1{margin:0 0 6px;font-size:25px}h2{font-size:19px}.muted{opacity:.7;font-size:14px}.tabs{display:flex;gap:6px;margin:20px 0}.tabs button{flex:1;font-size:13px;padding:12px 5px}.panel{background:white;border-radius:18px;padding:20px;box-shadow:0 3px 15px #1c31500c;margin:14px 0}button,select,input{font:inherit;border-radius:12px;padding:12px;border:1px solid #d8dfeb}button{background:#e8edf6;color:#172b4d;cursor:pointer;font-weight:600}button.active,.primary{background:#245ac4;color:white;border-color:#245ac4}button:disabled{opacity:.5}.wide{width:100%}.flash{min-height:175px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}.word{font-size:27px;font-weight:750;margin:12px 0}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.answer{margin:7px 0;width:100%;text-align:left}.correct{background:#d8f5e6}.wrong{background:#ffe1df}.tag{display:inline-block;background:#e8edf6;border-radius:50px;padding:5px 10px;font-size:12px}input{box-sizing:border-box;width:100%}.progress{background:#e6ebf3;height:9px;border-radius:20px;overflow:hidden}.bar{height:100%;background:#2e71d1}.small{font-size:13px}.hidden{display:none}</style></head><body><main><header><h1>Business English Trainer</h1><div>50 Wortfamilien · B2–C1 · Deutsch ↔ Englisch</div><p id="summary" class="muted"></p></header><nav class="tabs"><button data-tab="cards" class="active">Karten</button><button data-tab="quiz">Quiz</button><button data-tab="write">Schreiben</button><button data-tab="words">Wörter</button></nav><div class="panel"><label for="category">Themenbereich</label><select id="category" class="wide"><option value="all">Alle Themen</option></select></div><section id="content"></section></main><script>
const raw=[
['Entscheidungen & Argumentation',[
['to decide','entscheiden','decision','Entscheidung','decisive','entschlossen'],['to convince','überzeugen','conviction','Überzeugung','convincing','überzeugend'],['to assume','annehmen','assumption','Annahme','assumed','angenommen'],['to consider','berücksichtigen','consideration','Überlegung','considerable','erheblich'],['to conclude','schlussfolgern','conclusion','Schlussfolgerung','conclusive','eindeutig'],['to justify','rechtfertigen','justification','Begründung','justified','gerechtfertigt'],['to evaluate','bewerten','evaluation','Bewertung','evaluative','bewertend'],['to influence','beeinflussen','influence','Einfluss','influential','einflussreich'],['to persuade','überzeugen','persuasion','Überzeugungsarbeit','persuasive','überzeugend'],['to differ','sich unterscheiden','difference','Unterschied','different','unterschiedlich']]],
['Sicherheit & Erwartungen',[
['to be certain','sicher sein','certainty','Gewissheit','certain','sicher'],['to be uncertain','unsicher sein','uncertainty','Unsicherheit','uncertain','ungewiss'],['to rely on','sich verlassen auf','reliability','Zuverlässigkeit','reliable','zuverlässig'],['to depend on','abhängen von','dependence','Abhängigkeit','dependent','abhängig'],['to expect','erwarten','expectation','Erwartung','expected','erwartet'],['to predict','vorhersagen','prediction','Vorhersage','predictable','vorhersehbar'],['to doubt','bezweifeln','doubt','Zweifel','doubtful','zweifelhaft'],['to trust','vertrauen','trust','Vertrauen','trustworthy','vertrauenswürdig'],['to hesitate','zögern','hesitation','Zögern','hesitant','zögerlich'],['to be aware of','sich bewusst sein','awareness','Bewusstsein','aware','bewusst']]],
['Kommunikation & Teamwork',[
['to communicate','kommunizieren','communication','Kommunikation','communicative','kommunikativ'],['to collaborate','zusammenarbeiten','collaboration','Zusammenarbeit','collaborative','kooperativ'],['to contribute','beitragen','contribution','Beitrag','contributing','beitragend'],['to support','unterstützen','support','Unterstützung','supportive','unterstützend'],['to agree','zustimmen','agreement','Einigung','agreeable','angenehm'],['to clarify','klarstellen','clarification','Klarstellung','clear','klar'],['to respond','antworten','response','Antwort','responsive','reaktionsschnell'],['to engage','sich einbringen','engagement','Engagement','engaged','engagiert'],['to align','abstimmen','alignment','Abstimmung','aligned','abgestimmt'],['to coordinate','koordinieren','coordination','Koordination','coordinated','koordiniert']]],
['Fortschritt & Leistung',[
['to achieve','erreichen','achievement','Erfolg','achievable','erreichbar'],['to succeed','Erfolg haben','success','Erfolg','successful','erfolgreich'],['to improve','verbessern','improvement','Verbesserung','improved','verbessert'],['to perform','leisten','performance','Leistung','high-performing','leistungsstark'],['to develop','entwickeln','development','Entwicklung','developed','entwickelt'],['to progress','vorankommen','progress','Fortschritt','progressive','fortschrittlich'],['to accomplish','bewältigen','accomplishment','Errungenschaft','accomplished','versiert'],['to optimize','optimieren','optimization','Optimierung','optimal','optimal'],['to adapt','anpassen','adaptation','Anpassung','adaptable','anpassungsfähig'],['to prioritize','priorisieren','priority','Priorität','prioritized','priorisiert']]],
['Strategie & Verantwortung',[
['to challenge','herausfordern','challenge','Herausforderung','challenging','herausfordernd'],['to require','erfordern','requirement','Anforderung','required','erforderlich'],['to be responsible for','verantwortlich sein','responsibility','Verantwortung','responsible','verantwortlich'],['to manage','bewältigen','management','Management','manageable','machbar'],['to implement','umsetzen','implementation','Umsetzung','implemented','umgesetzt'],['to resolve','lösen','resolution','Lösung','resolved','gelöst'],['to assess','einschätzen','assessment','Einschätzung','assessable','bewertbar'],['to negotiate','verhandeln','negotiation','Verhandlung','negotiable','verhandelbar'],['to compete','konkurrieren','competition','Wettbewerb','competitive','wettbewerbsfähig'],['to strategize','strategisch planen','strategy','Strategie','strategic','strategisch']]]];
const examples={'to decide':'We need to decide by Friday.','to convince':'That is a convincing argument.','to assume':'I would assume that this is possible.','to consider':'We should take that into consideration.','to conclude':'What led you to that conclusion?','to clarify':'Could you clarify that?','to contribute':'I would be happy to contribute.','to align':'We need to make sure we are aligned.','to achieve':'This goal is achievable.','to improve':'There is room for improvement.','to adapt':'We need to adapt to the situation.','to assess':'We need to assess the situation first.','to be uncertain':'There is still some uncertainty.','to rely on':'We need reliable information.','to prioritize':'Let us prioritize the tasks.'};
const all=raw.flatMap(([cat,items])=>items.map((a,i)=>({id:cat+'-'+i,cat,forms:[[a[0],a[1],'Verb / Ausdruck'],[a[2],a[3],'Nomen'],[a[4],a[5],'Adjektiv']],example:examples[a[0]]||''})));
const $=id=>document.getElementById(id);let tab='cards',index=0,flip=false,answered=false,score=0,total=0,options=[],question=null;
let known={};try{known=JSON.parse(localStorage.getItem('businessEnglishKnown')||'{}')}catch(e){}
function save(){try{localStorage.setItem('businessEnglishKnown',JSON.stringify(known))}catch(e){}}
function pool(){let c=$('category').value;return all.filter(x=>c==='all'||x.cat===c)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function reset(){index=0;flip=false;answered=false;newQuestion();render()}
function newQuestion(){let p=pool();if(!p.length)return;question=p[Math.floor(Math.random()*p.length)];let form=Math.floor(Math.random()*3);question={...question,form};let answer=question.forms[form][0];let wrong=all.filter(x=>x.id!==question.id).map(x=>x.forms[form][0]);wrong=[...new Set(wrong.filter(x=>x!==answer))].sort(()=>Math.random()-.5).slice(0,3);options=[answer,...wrong].sort(()=>Math.random()-.5);answered=false}
function updateSummary(){let n=Object.values(known).filter(Boolean).length;$('summary').textContent=`${n} von 50 Wortfamilien gelernt`}
function render(){updateSummary();let p=pool();if(!p.length)return;index=(index+p.length)%p.length;let x=p[index],c=$('content');if(tab==='cards'){c.innerHTML=`<div class="panel"><div class="row"><span class="tag">${escapeHtml(x.cat)}</span><span class="small" style="text-align:right">${index+1} / ${p.length}</span></div><div class="progress" style="margin-top:15px"><div class="bar" style="width:${100*(index+1)/p.length}%"></div></div><div class="flash" id="flash"><span class="muted">${flip?'Übersetzungen':'Wortfamilie – antippen zum Umdrehen'}</span>${flip?x.forms.map(f=>`<p><b>${escapeHtml(f[0])}</b> – ${escapeHtml(f[1])}<br><small>${escapeHtml(f[2])}</small></p>`).join(''):`<div class="word">${escapeHtml(x.forms[0][0])}</div><p>${escapeHtml(x.forms[1][0])} · ${escapeHtml(x.forms[2][0])}</p>`}</div>${flip&&x.example?`<p class="small"><b>Beispiel:</b> ${escapeHtml(x.example)}</p>`:''}<button id="learn" class="wide ${known[x.id]?'primary':''}">${known[x.id]?'✓ Gelernt – erneut tippen zum Entfernen':'Als gelernt markieren'}</button><div class="row" style="margin-top:12px"><button id="prev">← Zurück</button><button id="next" class="primary">Weiter →</button></div></div>`;$('flash').onclick=()=>{flip=!flip;render()};$('learn').onclick=()=>{known[x.id]=!known[x.id];save();render()};$('prev').onclick=()=>{index--;flip=false;render()};$('next').onclick=()=>{index++;flip=false;render()};}
else if(tab==='words'){c.innerHTML=`<div class="panel"><h2>Alle Wortfamilien (${p.length})</h2>${p.map(x=>`<details style="padding:12px 0;border-bottom:1px solid #e8edf6"><summary><b>${escapeHtml(x.forms[0][0])}</b> – ${escapeHtml(x.forms[0][1])} ${known[x.id]?'✓':''}</summary>${x.forms.map(f=>`<p class="small">${escapeHtml(f[2])}: <b>${escapeHtml(f[0])}</b> – ${escapeHtml(f[1])}</p>`).join('')}${x.example?`<i>${escapeHtml(x.example)}</i>`:''}</details>`).join('')}</div>`}
else{if(!question||!p.some(x=>x.id===question.id))newQuestion();let f=question.forms[question.form],ans=f[0];c.innerHTML=`<div class="panel"><span class="tag">${tab==='quiz'?'Multiple Choice':'Schreibtrainer'}</span><p class="small">${score} richtige Antworten von ${total} Versuchen</p><h2>Wie heißt auf Englisch:</h2><div class="word">${escapeHtml(f[1])}</div><p class="muted">${escapeHtml(f[2])}</p>${tab==='quiz'?options.map(o=>`<button class="answer ${answered?(o===ans?'correct':''):''}" data-answer="${escapeHtml(o)}" ${answered?'disabled':''}>${escapeHtml(o)}</button>`).join(''):`<input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Englisches Wort eingeben" ${answered?'disabled':''}><button id="check" class="primary wide" style="margin-top:10px" ${answered?'disabled':''}>Prüfen</button>`}<div id="feedback"></div>${answered?`<button class="primary wide" id="nextQ" style="margin-top:12px">Nächste Frage →</button>`:''}</div>`;if(tab==='quiz')c.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>grade(b.dataset.answer));else if(!answered){$('check').onclick=()=>grade($('typed').value);$('typed').onkeydown=e=>{if(e.key==='Enter')grade($('typed').value)}}if(answered){$('feedback').innerHTML=`<p><b>Richtige Antwort:</b> ${escapeHtml(ans)}</p>`;$('nextQ').onclick=()=>{newQuestion();render()}}}}
function grade(v){if(answered)return;let correct=v.trim().toLowerCase().replace(/\s+/g,' ')===question.forms[question.form][0].toLowerCase();total++;if(correct)score++;answered=true;render();$('feedback').innerHTML=`<p style="color:${correct?'#147448':'#a32929'}"><b>${correct?'Richtig!':'Noch nicht ganz.'}</b> Richtige Antwort: ${escapeHtml(question.forms[question.form][0])}</p>`}
raw.forEach(([name])=>{let o=document.createElement('option');o.value=name;o.textContent=name;$('category').appendChild(o)});$('category').onchange=reset;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(z=>z.classList.toggle('active',z===b));reset()});newQuestion();render();
</script></body></html>
